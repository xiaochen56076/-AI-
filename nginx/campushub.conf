# CampusHub 生产站点配置
# 用法：cp nginx/campushub.conf /etc/nginx/sites-available/campushub
#      ln -s /etc/nginx/sites-available/campushub /etc/nginx/sites-enabled/campushub
#      nginx -t && systemctl reload nginx
# 部署路径与域名请按实际环境替换 /srv/campushub 与 campus.example.edu。

upstream campushub_app {
    # Gunicorn 通过 unix socket 提供服务，见 deploy/campushub-gunicorn.service
    server unix:/run/campushub/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name campus.example.edu;

    # certbot 续期校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus.example.edu;

    ssl_certificate     /etc/letsencrypt/live/campus.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /srv/campushub/web/dist;
    index index.html;

    # Django collectstatic 产物
    location /static/ {
        alias /srv/campushub/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 用户上传（活动封面等）
    location /media/ {
        alias /srv/campushub/media/;
        access_log off;
        expires 7d;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://campushub_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Django Admin 与 OpenAPI 文档
    location /admin/ {
        proxy_pass http://campushub_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带内容哈希的前端构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式：未知路径交回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
